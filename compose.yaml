services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ahtl:${POSTGRES_PASSWORD}@db:5432/ahtl
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ROLE_PASSWORD: ${ROLE_PASSWORD}
      ATTACHMENT_DIR: /data/attachments
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ahtl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ahtl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahtl -d ahtl"]
      interval: 5s
      retries: 15
volumes:
  pgdata:
  attachments:
